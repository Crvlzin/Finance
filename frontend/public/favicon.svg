<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Borda Externa com Gradiente FinanceHub -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#brandGradient)" />

  <!-- Fundo Interno Escuro Premium -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="#0b0f17" />

  <!-- Ícone TrendingUp (Mesmo do Login e Marca FinanceHub) -->
  <g transform="translate(14, 14) scale(1.5)" stroke="url(#lineGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
    <polyline points="16 7 22 7 22 13" />
  </g>
</svg>